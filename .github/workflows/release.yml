name: Release
on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write # Required for OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.BOT_TOKEN }}

      - name: Set up Git user
        run: |
          git config --global user.email "info@navigraph.com"
          git config --global user.name "Navigraph Bot"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build packages
        run: bun run build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v2.1.2
        with:
          publish-script: bun run release
          version-script: bun run version
          commit-message: "ci(changesets): version packages [no ci]"
          pr-title: "ci(changesets): version packages"
          github-token: ${{ secrets.BOT_TOKEN }}
